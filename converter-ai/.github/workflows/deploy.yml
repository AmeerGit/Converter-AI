name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger provider deployments
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render UI deployment
        env:
          RENDER_UI_DEPLOY_HOOK_URL: ${{ secrets.RENDER_UI_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_UI_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_UI_DEPLOY_HOOK_URL is not configured; Render Git integration can deploy automatically."
          else
            curl --fail-with-body --request POST "$RENDER_UI_DEPLOY_HOOK_URL"
          fi

      - name: Trigger Render API deployment
        env:
          RENDER_API_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_API_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_API_DEPLOY_HOOK_URL is not configured; Render Git integration can deploy automatically."
          else
            curl --fail-with-body --request POST "$RENDER_API_DEPLOY_HOOK_URL"
          fi
